<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="Catálogo de pines botón de Papelería Milán." />
    <meta property="og:title" content="Pines · Papelería Milán" />
    <meta property="og:description" content="Elige tus pines favoritos y haz tu pedido por WhatsApp." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo.
      try {
        var t = localStorage.getItem("milan-tema");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@400;500;600;700&display=swap"
    />
    <title>Pines · Papelería Milán</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
