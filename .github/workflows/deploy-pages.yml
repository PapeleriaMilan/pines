name: Publicar en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      # Obtiene la ruta base del sitio (ej. "/pines" o "" con dominio propio),
      # así funciona sin importar quién sea el dueño del repositorio.
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Construir con Vite
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # Pages no tiene reescrituras: 404.html = index.html para que funcionen
      # los enlaces directos a /diseno/... (la app resuelve la ruta).
      - name: Fallback para rutas de la SPA
        run: cp dist/index.html dist/404.html

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
